name: sindar_admin
description: SINDAR Master Admin licensing application.
publish_to: "none"
version: 1.0.0+100

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sindar_core:
    path: ../packages/sindar_core
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  sqflite: ^2.4.2
  path: ^1.9.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/sindar_logo.svg
    - assets/branding/sindar_brand_full.webp
