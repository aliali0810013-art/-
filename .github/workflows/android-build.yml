name: Android APK Build

on:
  push:
    branches:
      - sindar-phase1
      - sindar-rental-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - sindar_app
          - sindar_admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate and refresh Android host project
        working-directory: ${{ matrix.app }}
        run: flutter create --platforms=android --org com.sindar --project-name ${{ matrix.app }} .

      - name: Patch Android branding and permissions
        working-directory: ${{ matrix.app }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          icon = Path("android/app/src/main/res/drawable/sindar_launcher_icon.webp")
          if not icon.exists():
              raise SystemExit("Tracked SINDAR launcher icon is missing")
          text = path.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = (
              '\n    <uses-permission android:name="android.permission.CAMERA" />'
              '\n    <uses-permission android:name="android.permission.INTERNET" />'
          )
          if 'android.permission.CAMERA' not in text:
              text = text.replace(marker, marker + permissions)

          app_name = Path.cwd().name
          label = 'سندار' if app_name == 'sindar_app' else 'سندار - الإدارة'
          text = text.replace(
              'android:label="' + app_name + '"',
              'android:label="' + label + '"',
          )
          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@drawable/sindar_launcher_icon"',
          )
          path.write_text(text)
          PY

      - name: Configure stable Android release signing
        working-directory: ${{ matrix.app }}
        env:
          SINDAR_KEYSTORE_BASE64: ${{ secrets.SINDAR_KEYSTORE_BASE64 }}
          SINDAR_KEYSTORE_PASSWORD: ${{ secrets.SINDAR_KEYSTORE_PASSWORD }}
          SINDAR_KEY_ALIAS: ${{ secrets.SINDAR_KEY_ALIAS }}
          SINDAR_KEY_PASSWORD: ${{ secrets.SINDAR_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = ("SINDAR_KEYSTORE_BASE64", "SINDAR_KEYSTORE_PASSWORD",
                   "SINDAR_KEY_ALIAS", "SINDAR_KEY_PASSWORD")
          present = [bool(os.environ.get(name)) for name in names]
          if not all(present):
              raise SystemExit("Production signing blocked: configure all four SINDAR_* secrets.")
          else:
              destination = Path("android/app/release-keystore.jks")
              destination.write_bytes(base64.b64decode(os.environ["SINDAR_KEYSTORE_BASE64"], validate=True))
              gradle = Path("android/app/build.gradle.kts")
              if not gradle.exists():
                  raise SystemExit("Expected Flutter Kotlin Gradle file is missing; verify signing configuration.")
              source = gradle.read_text()
              original = 'signingConfig = signingConfigs.getByName("debug")'
              if source.count(original) != 1:
                  raise SystemExit("Cannot find exactly one generated release signingConfig statement.")
              block = """
                  signingConfigs {
                      create("release") {
                          storeFile = file("release-keystore.jks")
                          storePassword = System.getenv("SINDAR_KEYSTORE_PASSWORD")
                          keyAlias = System.getenv("SINDAR_KEY_ALIAS")
                          keyPassword = System.getenv("SINDAR_KEY_PASSWORD")
                      }
                  }

              """
              if source.count("    buildTypes {") != 1:
                  raise SystemExit("Cannot find Flutter buildTypes section.")
              source = source.replace("    buildTypes {", block + "    buildTypes {", 1)
              source = source.replace(original, 'signingConfig = signingConfigs.getByName("release")', 1)
              gradle.write_text(source)
              print("Configured stable signing from GitHub Actions secrets")
          PY

      - name: Resolve dependencies
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ matrix.app }}
        run: flutter analyze

      - name: Resolve shared core
        if: matrix.app == 'sindar_app'
        working-directory: packages/sindar_core
        run: dart pub get

      - name: Test shared core
        if: matrix.app == 'sindar_app'
        working-directory: packages/sindar_core
        run: dart test

      - name: Test
        working-directory: ${{ matrix.app }}
        run: flutter test --concurrency=1

      - name: Build release APK
        working-directory: ${{ matrix.app }}
        env:
          SINDAR_KEYSTORE_PASSWORD: ${{ secrets.SINDAR_KEYSTORE_PASSWORD }}
          SINDAR_KEY_ALIAS: ${{ secrets.SINDAR_KEY_ALIAS }}
          SINDAR_KEY_PASSWORD: ${{ secrets.SINDAR_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Stage final APK
        working-directory: ${{ matrix.app }}
        run: cp build/app/outputs/flutter-apk/app-release.apk ${{ matrix.app }}.apk

      - name: Print APK signing certificate
        working-directory: ${{ matrix.app }}
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs ${{ matrix.app }}.apk | tee signing-cert.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: |
            ${{ matrix.app }}/${{ matrix.app }}.apk
            ${{ matrix.app }}/signing-cert.txt
          if-no-files-found: error
