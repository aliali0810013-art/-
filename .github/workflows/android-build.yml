name: Android APK Build

on:
  push:
    branches:
      - sindar-phase1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - sindar_app
          - sindar_admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate and refresh Android host project
        working-directory: ${{ matrix.app }}
        run: flutter create --platforms=android --org com.sindar --project-name ${{ matrix.app }} .

      - name: Patch Android permissions
        working-directory: ${{ matrix.app }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = (
              '\n    <uses-permission android:name="android.permission.CAMERA" />'
              '\n    <uses-permission android:name="android.permission.INTERNET" />'
          )
          if 'android.permission.CAMERA' not in text:
              text = text.replace(marker, marker + permissions)
          path.write_text(text)
          PY

      - name: Resolve dependencies
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ matrix.app }}
        run: flutter analyze

      - name: Resolve shared core
        if: matrix.app == 'sindar_app'
        working-directory: packages/sindar_core
        run: dart pub get

      - name: Test shared core
        if: matrix.app == 'sindar_app'
        working-directory: packages/sindar_core
        run: dart test

      - name: Test
        working-directory: ${{ matrix.app }}
        run: flutter test

      - name: Build release APK
        working-directory: ${{ matrix.app }}
        run: flutter build apk --release

      - name: Stage final APK
        working-directory: ${{ matrix.app }}
        run: cp build/app/outputs/flutter-apk/app-release.apk ${{ matrix.app }}.apk

      - name: Print APK signing certificate
        working-directory: ${{ matrix.app }}
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs ${{ matrix.app }}.apk | tee signing-cert.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: |
            ${{ matrix.app }}/${{ matrix.app }}.apk
            ${{ matrix.app }}/signing-cert.txt
          if-no-files-found: error
