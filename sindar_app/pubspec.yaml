name: sindar_app
description: SINDAR accounting and document management app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  printing: ^5.14.2
  pdf: ^3.11.3
  share_plus: ^10.1.4
  google_sign_in: ^6.3.0
  googleapis: ^14.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  archive: ^4.0.7
  provider: ^6.1.4
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/sindar_logo.svg
