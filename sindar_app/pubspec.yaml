name: sindar_app
description: SINDAR accounting and document management app.
publish_to: "none"
version: 1.0.1+101

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sindar_core:
    path: ../packages/sindar_core
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  printing: ^5.14.2
  pdf: ^3.11.3
  share_plus: ^10.1.4
  google_sign_in: ^6.3.0
  googleapis: ^14.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.13
  archive: ^4.6.0
  provider: ^6.1.4
  uuid: ^4.5.1
  crypto: ^3.0.6
  cryptography: ^2.9.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/sindar_logo.svg
    - assets/branding/sindar_header_logo.svg
    - assets/branding/sindar_brand_full.webp
